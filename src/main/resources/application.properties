spring.application.name=brisa
spring.config.import=optional:file:./config-local.properties

spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
# sessão só por cookie: sem isso, o primeiro redirect de um navegador novo vira /;jsessionid=... e dá 404
server.servlet.session.tracking-modes=cookie

brisa.telegram.token=${TELEGRAM_TOKEN:}
# 1 minuto do protocolo vira N segundos na demonstração (30 min sem resposta = 30 s com o valor 1)
brisa.demo.segundos-por-minuto=1

# Sensor da casa (ESP32 + DHT22 no Wokwi) por MQTT. Deixe o broker vazio para desligar.
brisa.mqtt.broker=tcp://broker.hivemq.com:1883
# O último nível do tópico é o id do idoso. Payload: {"temperatura": 36.0}
brisa.mqtt.topico=brisa/fiap561902/casa/+
