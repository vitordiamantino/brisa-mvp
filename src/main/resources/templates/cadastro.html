<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragmentos :: head('Cadastrar idoso')}"></head>
<body>
<header th:replace="~{fragmentos :: topo}"></header>
<main class="conteudo estreito">
  <a class="voltar" th:href="@{/}">Voltar ao painel</a>
  <h1>Cadastrar idoso</h1>
  <p class="sub">Feito pela família ou pela UBS. O idoso não instala nada: só recebe mensagens.</p>
  <ul class="erros" th:if="${erros}"><li th:each="e : ${erros}" th:text="${e}">erro</li></ul>

  <form method="post" th:action="@{/idosos}" th:object="${form}" class="cartao formulario">
    <h2>Quem é</h2>
    <label>Nome <input type="text" th:field="*{nome}" maxlength="80" required></label>
    <div class="dupla">
      <label>Idade <input type="number" th:field="*{idade}" min="60" max="120" required></label>
      <label>CEP <input type="text" th:field="*{cep}" maxlength="9" placeholder="08210-000" required></label>
    </div>

    <h2>Saúde e casa</h2>
    <div class="checks">
      <label><input type="checkbox" th:field="*{moraSozinho}"> Mora sozinho(a)</label>
      <label><input type="checkbox" th:field="*{hipertenso}"> Hipertensão</label>
      <label><input type="checkbox" th:field="*{cardiaco}"> Doença cardíaca</label>
      <label><input type="checkbox" th:field="*{diabetico}"> Diabetes</label>
      <label><input type="checkbox" th:field="*{telhadoSemForro}"> Telha de fibrocimento sem forro</label>
    </div>
    <label>Temperatura atual da casa, se houver sensor (°C) <input type="number" step="0.1" th:field="*{temperaturaCasa}"></label>

    <h2>Rede de cuidado, na ordem de acionamento</h2>
    <div class="dupla">
      <label>1º contato <input type="text" th:field="*{contato1Nome}" required></label>
      <label>Papel <select th:field="*{contato1Papel}"><option>Família</option><option>Vizinho guardião</option><option>Agente de saúde</option></select></label>
    </div>
    <div class="dupla">
      <label>2º contato <input type="text" th:field="*{contato2Nome}"></label>
      <label>Papel <select th:field="*{contato2Papel}"><option>Família</option><option>Vizinho guardião</option><option>Agente de saúde</option></select></label>
    </div>
    <div class="dupla">
      <label>3º contato <input type="text" th:field="*{contato3Nome}"></label>
      <label>Papel <select th:field="*{contato3Papel}"><option>Família</option><option>Vizinho guardião</option><option>Agente de saúde</option></select></label>
    </div>

    <label class="lgpd"><input type="checkbox" th:field="*{consentimentoLgpd}">
      O idoso (ou responsável) autoriza o uso destes dados só para o cuidado em dias de calor (LGPD).</label>
    <button class="botao" type="submit">Cadastrar e calcular o risco de hoje</button>
  </form>
</main>
</body>
</html>
