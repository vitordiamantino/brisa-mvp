spring.application.name=brisa
spring.config.import=optional:file:./config-local.properties

spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

brisa.telegram.token=${TELEGRAM_TOKEN:}
# 1 minuto do protocolo vira N segundos na demonstração (30 min sem resposta = 30 s com o valor 1)
brisa.demo.segundos-por-minuto=1
